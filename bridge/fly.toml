app = "your-bridge-name"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  AUTH_DIR = "/data/auth"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "wa_auth"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"